name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # ── Same checks as CI: a red tag never produces binaries ────────────────────
  verify:
    uses: ./.github/workflows/ci.yml

  # ── Build agent binaries for all platforms ──────────────────────────────────
  build-agent:
    needs: [verify]
    name: Build agent (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: agent/go.sum

      - name: Build
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "clrc-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: clrc-${{ matrix.goos }}-${{ matrix.goarch }}
          path: agent/clrc-${{ matrix.goos }}-${{ matrix.goarch }}

  # ── Build relay binary ──────────────────────────────────────────────────────
  build-relay:
    needs: [verify]
    name: Build relay (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.22"
          cache-dependency-path: relay/go.sum

      - name: Build
        working-directory: relay
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "claude-relay-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: claude-relay-${{ matrix.goos }}-${{ matrix.goarch }}
          path: relay/claude-relay-${{ matrix.goos }}-${{ matrix.goarch }}

  # ── Create GitHub Release + update Homebrew formula ─────────────────────────
  release:
    name: Create Release
    needs: [build-agent, build-relay]
    runs-on: ubuntu-latest

    steps:
      # A tag push checks out a detached HEAD, which cannot be pushed back.
      # Check out the default branch instead: the formula/cask commit lands there,
      # which is where `brew tap tergeoo/clrc` reads them from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Install

            ### Homebrew (recommended)
            ```sh
            brew tap tergeoo/clrc https://github.com/tergeoo/clrc
            brew install clrc
            brew services start clrc   # auto-start on login
            ```

            ### One-liner
            ```sh
            curl -fsSL https://raw.githubusercontent.com/tergeoo/clrc/main/install.sh | sh
            ```

            ### Usage
            ```sh
            clrc start / stop / restart / status / logs
            ```

      - name: Update Homebrew formula and cask
        env:
          VERSION: ${{ github.ref_name }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          ARM64_SHA=$(sha256sum dist/clrc-darwin-arm64 | awk '{print $1}')
          AMD64_SHA=$(sha256sum dist/clrc-darwin-amd64 | awk '{print $1}')
          sh scripts/update-homebrew.sh "$VERSION" "$ARM64_SHA" "$AMD64_SHA"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/clrc.rb Casks/clrc.rb
          if git diff --staged --quiet; then
            echo "Formula and cask already at ${VERSION}"
            exit 0
          fi
          git commit -m "chore: update formula and cask to ${VERSION}"
          git push origin "HEAD:${BRANCH}"

  # ── Build and push Docker image to GHCR ─────────────────────────────────────
  docker:
    name: Push Docker image
    needs: [build-agent]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/clrc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./agent
          file: ./agent/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
