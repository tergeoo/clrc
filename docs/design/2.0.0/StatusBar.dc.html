<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:{{ h }};flex:none;display:flex;align-items:center;justify-content:space-between;padding:{{ pad }};box-sizing:border-box;font:600 {{ fs }}/1 -apple-system,'SF Pro Text',system-ui,'Helvetica Neue',sans-serif;position:relative;color:{{ fg }};width:100%">
  <span>9:41</span>
  <sc-if value="{{ island }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px"></div></sc-if>
  <div style="display:flex;gap:6px;align-items:center">
    <div style="display:flex;gap:2px;align-items:flex-end"><div style="width:3px;height:4px;background:currentColor;border-radius:1px"></div><div style="width:3px;height:6px;background:currentColor;border-radius:1px"></div><div style="width:3px;height:8px;background:currentColor;border-radius:1px"></div><div style="width:3px;height:10px;background:currentColor;border-radius:1px"></div></div>
    <div style="width:25px;height:12px;border:1.5px solid currentColor;border-radius:4px;padding:1.5px;box-sizing:border-box;opacity:.95"><div style="width:72%;height:100%;background:currentColor;border-radius:1.5px"></div></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:393,&quot;height&quot;:54},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;se&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;landscape&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const se = !!this.props.se, land = !!this.props.landscape;
    return {
      fg: this.props.dark ? '#fff' : '#000',
      island: !se && !land,
      h: se ? '20px' : land ? '28px' : '54px',
      pad: se ? '0 8px' : land ? '0 60px' : '6px 32px 0 50px',
      fs: se ? '12px' : '17px'
    };
  }
}
</script>
</body>
</html>
