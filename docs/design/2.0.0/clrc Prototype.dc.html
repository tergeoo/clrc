<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>body{margin:0;background:#E6E5E1}a{color:#0062CC;text-decoration:none}a:hover{color:#003E80;text-decoration:underline}</style>
</helmet>
<div style="min-height:100vh;box-sizing:border-box;padding:40px 32px;display:flex;gap:56px;justify-content:center;align-items:flex-start;flex-wrap:wrap;font-family:-apple-system,'SF Pro Text',system-ui,'Helvetica Neue',sans-serif;color:#1C1C1E">
  <div style="padding:11px;flex:none">
    <div style="width:393px;height:852px;border-radius:55px;overflow:hidden;position:relative;box-shadow:0 0 0 10px #111113,0 0 0 11px #48484A,0 30px 60px -20px rgba(0,0,0,.35)">
      <sc-if value="{{ is.onboarding }}" hint-placeholder-val="{{ false }}"><dc-import name="Onboarding" dark="{{ dark }}" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.inbox }}" hint-placeholder-val="{{ true }}"><dc-import name="Inbox" variant="{{ inboxVariant }}" state="{{ inboxState }}" dark="{{ dark }}" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.newtask }}" hint-placeholder-val="{{ false }}"><dc-import name="NewTask" dark="{{ dark }}" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.chat }}" hint-placeholder-val="{{ false }}"><dc-import name="Chat" variant="{{ chatVariant }}" dark="{{ dark }}" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.terminal }}" hint-placeholder-val="{{ false }}"><dc-import name="Terminal" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.review }}" hint-placeholder-val="{{ false }}"><dc-import name="ReviewList" dark="{{ dark }}" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.mr }}" hint-placeholder-val="{{ false }}"><dc-import name="MergeRequest" kind="gitlab" dark="{{ dark }}" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.changes }}" hint-placeholder-val="{{ false }}"><dc-import name="MergeRequest" kind="claude" dark="{{ dark }}" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.diff }}" hint-placeholder-val="{{ false }}"><dc-import name="Diff" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.projects }}" hint-placeholder-val="{{ false }}"><dc-import name="Projects" dark="{{ dark }}" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.file }}" hint-placeholder-val="{{ false }}"><dc-import name="FileViewer" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.settings }}" hint-placeholder-val="{{ false }}"><dc-import name="Settings" dark="{{ dark }}" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
      <sc-if value="{{ is.lock }}" hint-placeholder-val="{{ false }}"><dc-import name="LockScreen" mode="push" on-nav="{{ nav }}" style="width:393px;height:852px" hint-size="393px,852px"></dc-import></sc-if>
    </div>
  </div>
  <div style="width:300px;display:flex;flex-direction:column;gap:18px;padding-top:12px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <div style="font:600 13px ui-monospace,'SF Mono',Menlo,monospace;color:#6C6C70">clrc · прототип</div>
      <div style="font-size:28px;font-weight:700;line-height:1.15">Кликайте по экрану</div>
      <div style="font-size:15px;line-height:1.45;color:#3C3C43">Кнопки ответов, чипы, «Ответить…», «Новая задача», вкладки, файлы в отчёте и строки diff работают. Все экраны — <a href="clrc Screens.dc.html">clrc Screens</a>.</div>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <div style="font-size:13px;color:#6C6C70;text-transform:uppercase;letter-spacing:.3px;padding-bottom:4px">Перейти</div>
      <sc-for list="{{ jumps }}" as="j" hint-placeholder-count="10">
        <div onClick="{{ j.tap }}" style="height:36px;padding:0 12px;border-radius:10px;background:{{ j.bg }};color:{{ j.fg }};font-size:15px;display:flex;align-items:center;justify-content:space-between;cursor:pointer"><span>{{ j.t }}</span><span style="font:12px ui-monospace,'SF Mono',Menlo,monospace;opacity:.6">{{ j.ref }}</span></div>
      </sc-for>
    </div>
    <div onClick="{{ back }}" style="height:40px;border-radius:10px;background:#fff;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:{{ backOp }}">← Назад</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;inboxVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a&quot;,&quot;b&quot;,&quot;c&quot;],&quot;default&quot;:&quot;a&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;chatVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;chat&quot;,&quot;brief&quot;,&quot;pinned&quot;],&quot;default&quot;:&quot;chat&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;start&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lock&quot;,&quot;onboarding&quot;,&quot;inbox&quot;],&quot;default&quot;:&quot;inbox&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { stack: null, inboxState: 'normal' };
  go(k) {
    const map = { 'inbox-answered': 'inbox' };
    const target = map[k] || k;
    const stack = this.stack();
    this.setState({ stack: [...stack, target], inboxState: k === 'inbox-answered' ? 'answered' : 'normal' });
  }
  stack() { return this.state.stack ?? [this.props.start ?? 'inbox']; }
  renderVals() {
    const p = this.props, stack = this.stack(), cur = stack[stack.length - 1];
    const keys = ['onboarding','inbox','newtask','chat','terminal','review','mr','changes','diff','projects','file','settings','lock'];
    const is = {}; keys.forEach(k => is[k] = k === cur);
    const J = [['lock','Push на экране блокировки','5.12'],['onboarding','Вход','5.1'],['inbox','Входящие','5.2'],['newtask','Новая задача','5.3'],['chat','Чат','5.4'],['terminal','Терминал','5.6'],['review','Ревью','5.7'],['mr','Merge request','5.8'],['diff','Diff файла','5.8'],['projects','Проект','5.9'],['file','Просмотр файла','5.10'],['settings','Настройки','5.11']];
    return {
      is, dark: !!p.dark, inboxVariant: p.inboxVariant ?? 'a', chatVariant: p.chatVariant ?? 'chat', inboxState: this.state.inboxState,
      nav: k => this.go(k),
      jumps: J.map(([k, t, ref]) => ({ t, ref, bg: k === cur ? '#1C1C1E' : '#fff', fg: k === cur ? '#fff' : '#1C1C1E', tap: () => this.setState({ stack: [...stack, k], inboxState: 'normal' }) })),
      back: () => stack.length > 1 && this.setState({ stack: stack.slice(0, -1), inboxState: 'normal' }), backOp: stack.length > 1 ? 1 : .4
    };
  }
}
</script>
</body>
</html>
